name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  protocol-tests:
    name: 协议单测 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install bleak
      - name: 语法自检
        run: python -m compileall -q wt9011 tools tests
      - name: 跑协议单测
        run: python -m unittest discover -s tests -v

  gui-smoke:
    name: 界面冒烟（offscreen + 模拟数据）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install bleak PySide6 pyqtgraph
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0
      - name: 运行界面冒烟测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_gui.py --seconds 6 --screenshot /tmp/gui.png
      - uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot
          path: /tmp/gui.png
          if-no-files-found: warn
