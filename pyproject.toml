[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wt9011-linux"
version = "0.1.0"
description = "WT9011DCL-BT50（维特智能 BLE 5.0 传感器）的 Linux 上位机：PySide6 图形界面 + bleak (BlueZ) 蓝牙后端"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "chenweidu666" }]
keywords = ["wt9011", "wt9011dcl-bt50", "witmotion", "imu", "ble", "bluetooth", "bleak", "pyside6", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "bleak>=0.21",
]

[project.urls]
Homepage = "https://github.com/chenweidu666/APP-WT9011DCL-BT50-Linux"
Issues = "https://github.com/chenweidu666/APP-WT9011DCL-BT50-Linux/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.5", "pyqtgraph>=0.13"]
dev = ["pytest>=7"]

[project.scripts]
wt9011 = "wt9011.cli:main"
wt9011-gui = "wt9011.gui:main"

[tool.setuptools]
packages = ["wt9011"]
