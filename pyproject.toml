[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wt9011-linux"
version = "0.1.0"
description = "WT9011DCL-BT50（维特智能 BLE 5.0 传感器）的 Linux 上位机：PySide6 图形界面 + bleak (BlueZ) 蓝牙后端"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bleak>=0.21",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5", "pyqtgraph>=0.13"]
dev = ["pytest>=7"]

[project.scripts]
wt9011 = "wt9011.cli:main"
wt9011-gui = "wt9011.gui:main"

[tool.setuptools]
packages = ["wt9011"]
